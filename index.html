<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kanna_san38's Donate Page</title>
<link rel="icon" type="image/jpeg" href="bdd6c1f2-cd41-495c-9d8d-fbc5f93fa4bd.jpg">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #1a1a2e, #16213e);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    margin-bottom: 16px;
  }

  .name {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .bio {
    color: #cfd2e0;
    font-size: 14px;
    margin: 0 0 28px;
  }

  .link-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    background: #ffffff;
    color: #1a1a2e;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    background: #f0f0f0;
  }

  /* ปรับสีปุ่มแต่ละแพลตฟอร์มได้ตรงนี้ */
  .link-btn.easydonate   { background: #0066ff; color: #020205; }
  .link-btn.rindonate   { background: #ff9900; color: #1a1a2e; }

  .footer {
    color: #6b6f8a;
    font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="bdd6c1f2-cd41-495c-9d8d-fbc5f93fa4bd.jpg" alt="โปรไฟล์">
    <p class="name">@kanna_san38</p>
    <p class="bio">สวัสดีครับ ผมมีชื่อว่าเฟิ้ดเฟิดนะคับ✨ ขอบคุณที่เข้ามารับชมและคอยสนับสนุนผมนะครับ🔥</p>

    <a class="link-btn easydonate" href="https://easydonate.app/kanna_san38" target="_blank">EasyDonate</a>
    <a class="link-btn rindonate" href="https://ferdferddonates-production.up.railway.app/donate.html" target="_blank">FerdFerd Donate</a>


    <p class="footer">© 2026 kanna_san38</p>
  </div>

</body>
</html>
